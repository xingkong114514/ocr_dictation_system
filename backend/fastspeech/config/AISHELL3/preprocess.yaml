dataset: "AISHELL3"

path:
  corpus_path: ""
  lexicon_path: "fastspeech/lexicon/pinyin-lexicon-r.txt"
  phrase_phone_path: "fastspeech/lexicon/phrase_phones_dict.json"
  raw_path: "./raw_data/biaobei/"
  preprocessed_path: "./preprocessed_data/biaobei/"
  expanded_char_path: "./preprocessor/expanded_embeds.pkl"
  char_model_path: "fastspeech/transformer/prosody_model/"

preprocessing:
  val_size: 512
  text:
    text_cleaners: []
    language: "zh"
  audio:
    sampling_rate: 22050
    last_sr: 22050
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000
  pitch:
    feature: "phoneme_level"
    normalization: True
  energy:
    feature: "phoneme_level"
    normalization: True
